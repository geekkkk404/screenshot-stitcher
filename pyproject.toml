[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshot-stitcher"
version = "0.1.0"
description = "CLI for stitching vertically scrolling iPhone screenshots into one long image"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy",
  "opencv-python",
]
keywords = ["ios", "iphone", "screenshot", "stitching", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Utilities",
]

[project.scripts]
screenshot-stitcher = "main:main"

[project.urls]
Homepage = "https://github.com/mate-matt/screenshot-stitcher"
Repository = "https://github.com/mate-matt/screenshot-stitcher"
Issues = "https://github.com/mate-matt/screenshot-stitcher/issues"

[tool.setuptools]
py-modules = ["main", "config", "stitcher"]
